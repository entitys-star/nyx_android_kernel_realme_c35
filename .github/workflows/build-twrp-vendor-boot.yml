name: Build TWRP vendor_boot (RMX3511)

on:
  workflow_dispatch:
    inputs:
      vendor_boot_url:
        description: "Direct URL to the stock RMX3511T2_13.F.73 vendor_boot.img release asset"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'

      - name: Check out device tree and tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: device-tree-source

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl cpio flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2-utils lz4 openjdk-11-jdk pngcrush python3 python3-pip rsync \
            schedtool squashfs-tools unzip x11proto-core-dev xsltproc zip zlib1g-dev
          python3 -m pip install --user lz4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          java -version

      - name: Download and verify stock vendor_boot
        env:
          VENDOR_BOOT_URL: ${{ inputs.vendor_boot_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$VENDOR_BOOT_URL" -o "$RUNNER_TEMP/vendor_boot.img"
          echo "Downloaded SHA-256:"
          sha256sum "$RUNNER_TEMP/vendor_boot.img"
          echo "17e5c60be1414e56fabfaf50887aa1e2dc910e8dc6516ad2182fce182762c4b1  $RUNNER_TEMP/vendor_boot.img" | sha256sum --check -

      - name: Stage stock ramdisk and DTB
        run: |
          set -euo pipefail
          cd device-tree-source
          python3 tools/prepare_vendor_ramdisk.py "$RUNNER_TEMP/vendor_boot.img"
          test -s device/realme/ums9230_nico/prebuilt/dtb.img
          test -s device/realme/ums9230_nico/recovery/root/lib/modules/modules.load.recovery
          git status --short

      - name: Initialize TWRP source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/twrp"
          cd "$RUNNER_TEMP/twrp"
          curl --fail --location https://storage.googleapis.com/git-repo-downloads/repo -o repo
          chmod +x repo
          sudo install repo /usr/local/bin/repo
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c --no-tags --optimized-fetch --prune -j2

      - name: Install device tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/twrp/device/realme"
          cp -a device-tree-source/device/realme/ums9230_nico "$RUNNER_TEMP/twrp/device/realme/ums9230_nico"
          test -s "$RUNNER_TEMP/twrp/device/realme/ums9230_nico/prebuilt/dtb.img"
          test -s "$RUNNER_TEMP/twrp/device/realme/ums9230_nico/recovery/root/lib/modules/modules.load.recovery"

      - name: Build vendor_boot image
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"
          source build/envsetup.sh
          lunch twrp_ums9230_nico-eng
          mka vendorbootimage -j2

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          OUT="$RUNNER_TEMP/twrp/out/target/product/ums9230_nico"
          if [ -d "$OUT" ]; then
            find "$OUT" -maxdepth 1 -type f \\( -name 'vendor_boot.img' -o -name 'vendorboot.img' -o -name 'recovery.img' -o -name '*.map' \\) -print -exec cp -f {} "$GITHUB_WORKSPACE/build-output/" \\;
          fi
          df -h
          ls -lh "$GITHUB_WORKSPACE/build-output" || true

      - name: Upload build output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmx3511-twrp-vendor-boot
          path: |
            build-output/
            device-tree-source/
          if-no-files-found: warn
          retention-days: 7
